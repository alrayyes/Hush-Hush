# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.
#
# Grows a job here the same PR that adds the tool it runs — a linter with no
# hook is a linter you only meet at CI.

# Silent on a clean run, full detail on a failure. lefthook's default prints a
# banner and a line per job, which is noise to a person and pure token cost once
# a hook's output lands in an agent's tool result (rules/linting.md).
output:
  - failure

# pre-commit may write. Let every fixer run and restage what it touched — a
# commit should not fail over a quote style a tool can settle by itself.
pre-commit:
  jobs:
    # gofumpt (a gofmt superset) is what .golangci.yml's formatters actually
    # run - calling plain gofmt here too would be two formatters arguing over
    # the same bytes, the exact thing rules/go-lint.md says not to do.
    #
    # Docker-wrapped, like every other Go hook command below: a host go and
    # golangci-lint drifting apart independently is a real failure mode
    # (go.md), not a hypothetical - hit live on this machine once already.
    # --user keeps the fixer's writes owned by the invoking user, not root;
    # the GOCACHE/GOMODCACHE/GOLANGCI_LINT_CACHE mounts keep a second run
    # from paying a cold cache every time.
    - name: golangci-lint fmt
      glob: "*.go"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        -e GOLANGCI_LINT_CACHE=/lintcache -v "$HOME/.cache/golangci-lint-docker:/lintcache"
        golangci/golangci-lint:v2.13.1@sha256:d371321370bf2907bd13a8f6f8baff0e0ca7438d76fdf636b281eadf7e2305e3
        golangci-lint fmt {staged_files}
      stage_fixed: true

    # go mod edit -fmt is the canonicalizer for go.mod itself: a builtin `go`
    # subcommand, not gofmt (which never touches go.mod) and not `go mod tidy`
    # (which does network resolution a formatting-only hook shouldn't be
    # doing). golang:<go.mod's own go directive>-bookworm, matching the
    # Dockerfile and CI's pin exactly.
    - name: gomod
      glob: "go.mod"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm@sha256:69a7b9788769bec032d238959b61854e9ae87f57be9029ec04e9885fabf99195
        go mod edit -fmt go.mod
      stage_fixed: true

    # Prettier decides the layout, markdownlint then judges what Prettier
    # produced. The other order has markdownlint fixing something Prettier is
    # about to overwrite.
    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    # Keeps package.json itself canonical, the same job Prettier does for
    # everything else - Prettier doesn't format JSON key order, only the
    # bytes.
    - name: sort-package-json
      glob: "package.json"
      run: bunx sort-package-json {staged_files}
      stage_fixed: true

    # Fast enough for a commit. LTeX is not — around ten seconds a file — so
    # mechanics run at push instead, where the wait is paid once rather than
    # per commit.
    - name: vale
      glob: "*.md"
      exclude:
        - "CHANGELOG.md"
        - "cmd/hush-hush/web/AGENTS.md"
        - "cmd/hush-hush/web/.claude/**"
        - "cmd/hush-hush/web/build/CHANGELOG.md"
      # --minAlertLevel=error overrides .vale.ini's MinAlertLevel=warning
      # for this hook specifically - markdown.md's "let Vale mostly warn,
      # fail the build only on the rules worth failing on" was never
      # actually true here: a bare `vale {staged_files}` exits nonzero on
      # any warning too (Google's own word-choice/heading-casing advice
      # included), which every spec.md's established `### Requirement:
      # Capitalized text` heading convention already trips. `bun run
      # lint:prose` (pre-push, CI) still reports warnings for visibility;
      # this only changes what blocks a commit.
      run: ./scripts/vale.sh --minAlertLevel=error {staged_files}

    # Reads only, so it changes nothing to restage. Invoked bare rather than
    # on {staged_files}: what gets linted is the `apis` list in redocly.yaml,
    # and naming a path here is how the hook and CI end up checking different
    # files. The glob only decides whether it's worth running at all.
    - name: redocly
      glob:
        - "api/*.yaml"
        - "api/*.yml"
        - "api/**/*.yaml"
        - "api/**/*.yml"
        - "redocly.yaml"
      run: bunx redocly lint

    # Pinned by digest rather than `latest`, like any other container image —
    # dependencies.md's rule applies to an image named in a hook command just
    # as much as one named in the Dockerfile itself. Both Dockerfiles get
    # hadolint (containers.md: "every Dockerfile, no exceptions") - passed
    # as file arguments rather than stdin so one invocation covers both.
    - name: hadolint
      glob:
        - "Dockerfile"
        - "Dockerfile.release"
      run: >-
        docker run --rm
        -v "$(pwd)/.hadolint.yaml:/.hadolint.yaml"
        -v "$(pwd)/Dockerfile:/Dockerfile"
        -v "$(pwd)/Dockerfile.release:/Dockerfile.release"
        hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        hadolint Dockerfile Dockerfile.release

commit-msg:
  jobs:
    # Resolved from node_modules rather than fetched by bunx: commitlint has to
    # load the config its own config extends, and bunx cannot resolve a sibling
    # package for it. Run `bun install` if this cannot find itself.
    - name: commitlint
      run: bunx commitlint --edit {1}

# The pre-push globs below mirror the filters under `changes` in
# .github/workflows/ci.yml, one list per filter, so a push runs the checks CI
# would run for the same files and no others (rules/ci.md, "Run a check only
# when the files it covers change"). Edit a list here and its filter there
# together. Each also names this file and ci.yml, as the filters name ci.yml,
# so editing the pipeline's own config runs everything.
#
# Only pre-push uses them. The pre-commit globs stay per-tool: they pick
# staged files to hand a fixer, not whether a whole check is worth running.

# The pre-push globs mirror the filters under `changes` in ci.yml, so a push
# runs the checks CI would run for the same files and no others (rules/ci.md,
# "Run a check only when the files it covers change"). Edit a list here and its
# filter there together. Each list also names lefthook.yml and ci.yml, as the
# filters name ci.yml, so a change to the pipeline's own config runs
# everything.
#
# Each list is spelled out once, at the first job that needs it
# (`glob: &name-files`), and the other jobs reuse it (`glob: *name-files`).
# lefthook rejects an unknown top-level key, so there is no shared block to hold
# them. Patterns like `*.go` have no `**/`, which lefthook's default matcher
# needs to match a file at the repository root as well as in a directory.
#
# The pre-commit globs stay per tool: they pick staged files to hand a fixer,
# not whether a whole check is worth running.
#
# pre-push never writes. A hook rewriting files under a push leaves the pushed
# commit and the working tree disagreeing about what was reviewed.
#
# Parallel because of that: nothing here touches a file, so no job can be
# reading what another is rewriting.
# Checks CI runs that this hook doesn't, and why (a gap should be a decision,
# not an oversight):
#
# - govulncheck and bun-audit read an advisory database that changes under
#   you. A green local run says nothing about next week and a red one blames the
#   wrong push, so CI runs them when a lockfile changes and audit.yml runs them
#   daily.
# - pact (provider verification) links a native Pact library at build time,
#   behind the `pact` build tag, which needs `pact-go install` first. No other
#   hook needs that download.
# - goreleaser check needs the goreleaser binary, which no other hook installs.
#   It only reads .goreleaser.yml, and CI runs it before a release can be cut,
#   so a typo costs a red job, not a bad release.
# - gitleaks scans the whole git history. CI checks out all of it and runs the
#   scan on every push and pull request; a local clone may not have it.
# - e2e and lighthouse: see web-check below.
#
# The toolchain pins below (golang:1.27.1-bookworm@sha256:69a7...) are the same
# image as the Dockerfile's and CI's. Dependabot bumps the Dockerfile only, so
# change them together.
pre-push:
  parallel: true
  jobs:
    # go-lint.md: "gofmt -w (or golangci-lint fmt) is pre-commit's fixer;
    # golangci-lint run ./... is pre-push's check - never the reverse, and
    # never both in the same hook." `golangci-lint run --fix` was
    # previously (wrongly) in pre-commit instead - it still runs the full
    # linter set regardless of --fix, so trimming to staged files barely
    # trims the run time, and paying that cost on every commit is exactly
    # what the rule argues against. Moved here, alongside the matching
    # `fmt --diff` check-only pass CI's own lint job runs.
    # Mirrors the `go` filter under `changes` in ci.yml.
    - name: golangci-lint fmt
      glob: &go-files
        - "*.go"
        - "go.mod"
        - "go.sum"
        - ".golangci.y*ml"
        - "api/openapi.yaml"
        - "pacts/**"
        - "cmd/hush-hush/web/build/**"
        - ".github/workflows/ci.yml"
        - "lefthook.yml"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        -e GOLANGCI_LINT_CACHE=/lintcache -v "$HOME/.cache/golangci-lint-docker:/lintcache"
        golangci/golangci-lint:v2.13.1@sha256:d371321370bf2907bd13a8f6f8baff0e0ca7438d76fdf636b281eadf7e2305e3
        golangci-lint fmt --diff

    - name: golangci-lint run
      glob: *go-files
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        -e GOLANGCI_LINT_CACHE=/lintcache -v "$HOME/.cache/golangci-lint-docker:/lintcache"
        golangci/golangci-lint:v2.13.1@sha256:d371321370bf2907bd13a8f6f8baff0e0ca7438d76fdf636b281eadf7e2305e3
        golangci-lint run

    # Docker-wrapped, same reasoning and pin as pre-commit's Go jobs above.
    # `-race` like CI's own test job, so a data race fails here instead of in
    # the pipeline. It roughly doubles the run (4s to 9s on a warm cache), which
    # a push can carry. CI also writes coverage, which only matters there.
    - name: test
      glob: *go-files
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm@sha256:69a7b9788769bec032d238959b61854e9ae87f57be9029ec04e9885fabf99195
        go test -race ./...

    # No check-only flag on `go mod edit -fmt`, so the gate is running it
    # again and diffing. A no-op on a go.mod pre-commit already canonicalized;
    # only fails if that got bypassed. Only the edit itself needs Docker -
    # the mount is live, not a copy, so the diff check right after runs
    # against the host's own git same as any other pre-push job here.
    #
    # `go mod tidy -diff` is a separate, broader check run after: -fmt alone
    # only canonicalizes formatting, not a stale require, a non-canonical
    # version string, or an orphaned go.sum entry - go-mod.md's reasoning for
    # keeping it here rather than folding it into the pre-commit -fmt step.
    - name: gomod
      glob: *go-files
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm@sha256:69a7b9788769bec032d238959b61854e9ae87f57be9029ec04e9885fabf99195
        go mod edit -fmt go.mod
        && git diff --exit-code go.mod
        && docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm@sha256:69a7b9788769bec032d238959b61854e9ae87f57be9029ec04e9885fabf99195
        go mod tidy -diff

    # cmd/hush-hush/web is its own bun project (CONTRIBUTING.md), so its
    # checks `cd` there to run `bun run <script>`, where those scripts exist.
    # Not lefthook's `root:`, which drops every file outside that directory
    # before `glob` looks at it, so a change to lefthook.yml or ci.yml would
    # never reach these jobs. Scoped with `glob` to the web filter, so a push
    # touching none of those files skips all three.
    #
    # `bun run test:e2e` (Playwright/axe-core, alrayyes/hush-hush#384)
    # stays CI-only, decided by timing a real run rather than guessing:
    # a fresh `bun run test:e2e` - full suite, no reused server - took
    # about 8-9 seconds wall clock, comfortably inside what a pre-push
    # hook can carry. Speed isn't why it's excluded. `e2e/server.sh`, its
    # own Playwright webServer, runs `go build` directly on the host to
    # start the real Go binary - unlike every Go command above, which is
    # Docker-wrapped specifically so a host without Go installed still
    # gets a working hook (CONTRIBUTING.md's "Go 1.27 or newer... Not
    # required for the hooks themselves"). Adding it here would quietly
    # make a native Go toolchain a new prerequisite for pushing at all,
    # which costs more than paying for the check again in CI.
    # `bun run lighthouse` (Lighthouse, same issue) has the identical
    # native-Go dependency and stays CI-only for the same reason - moot
    # either way, since it only ever warns rather than blocks.
    # Mirrors the `web` filter.
    - name: web-check
      glob: &web-files
        - "cmd/hush-hush/web/**"
        - "api/openapi.yaml"
        - "CHANGELOG.md"
        - "LICENSE"
        - "package.json"
        - "bun.lock"
        - ".github/workflows/ci.yml"
        - "lefthook.yml"
      run: cd cmd/hush-hush/web && bun run check

    # Check mode, so a pre-push never rewrites the generated files; a stale
    # one fails and `bun run generate:api` fixes it.
    - name: web-api-types
      glob: *web-files
      run: cd cmd/hush-hush/web && bun run generate:api:check

    - name: web-lint
      glob: *web-files
      run: cd cmd/hush-hush/web && bun run lint

    # @shadcn/lint (rules/tailwind.md) via oxlint - a separate job/script
    # from web-lint above rather than folded into `bun run lint`, matching
    # every other tool here having its own named job.
    - name: web-lint-tailwind
      glob: *web-files
      run: cd cmd/hush-hush/web && bun run lint:tailwind

    # These are `package.json` scripts rather than the commands spelled out,
    # because CI runs the same ones and a literal copied into two files drifts
    # the first time somebody edits one of them.
    # Mirrors the `prose` filter.
    - name: prettier
      glob: &prose-files
        - "*.{md,yml,yaml}"
        - "styles/**"
        - ".vale.ini"
        - ".markdownlint*"
        - ".prettier*"
        - ".editorconfig"
        - "package.json"
        - "bun.lock"
        - "lefthook.yml"
      run: bun run format:check

    - name: markdownlint
      glob: *prose-files
      run: bun run lint:md

    # Every other linter here runs at commit, at push and in CI. Vale ran at
    # commit and then nothing until CI, because its invocation lived in the
    # workflow as a block of bash with nothing a hook could reuse. It is a
    # script now, and this is the whole-tree run that was missing.
    - name: vale
      glob: *prose-files
      run: bun run lint:prose

    # Grammar and spelling. Left out of pre-commit on the grounds that it is a
    # ~300 MB download, which it is — but it caches outside the repository and
    # then costs about ten seconds.
    - name: mechanics
      glob: *prose-files
      run: bun run lint:mechanics

    # Mirrors the `api` filter.
    - name: redocly
      glob: &api-files
        - "api/**"
        - "docs/api/**"
        - "redocly.yaml"
        - "package.json"
        - "bun.lock"
        - ".github/workflows/ci.yml"
        - "lefthook.yml"
      run: bun run lint:api

    # Mirrors the `package-json` filter.
    - name: sort-package-json
      glob: &package-json-files
        - "package.json"
        - ".github/workflows/ci.yml"
        - "lefthook.yml"
      run: bun run lint:package-json

    # The pipeline's own wiring (scripts/test-ci.ts): CI runs it as `ci-config`.
    # Same files as that job's filter in ci.yml.
    - name: ci-config
      glob:
        - ".github/workflows/**"
        - "lefthook.yml"
        - "scripts/test-ci.ts"
        - "Dockerfile*"
        - "go.mod"
        - "package.json"
        - "bun.lock"
      run: bun run test:ci

    # A strict superset of a bare `docker build`: testcontainers-go builds
    # the same Dockerfile, then actually starts the container and proves
    # it serves real requests - the packaged distroless artifact, not the
    # server's Go code run directly the way every other test here does.
    #
    # Deliberately NOT Docker-wrapped, unlike every other Go job above:
    # testcontainers-go needs a real Docker daemon to build and run
    # against, which the host already has - wrapping this command in
    # another container would need Docker-outside-of-Docker (mounting
    # /var/run/docker.sock into it) for no benefit over just not nesting,
    # the same reasoning ci.yml's own container-integration job gives for
    # staying off a `container:` runner.
    # Mirrors ci.yml's container-integration `if`: the `go`, `web-src`, `docker`
    # and `integration` filters together. `web-src` is cmd/hush-hush/web/**
    # alone, so the web list here lacks the changelog, license and lockfile.
    - name: container-integration
      glob: &container-integration-files
        - "*.go"
        - "go.mod"
        - "go.sum"
        - ".golangci.y*ml"
        - "api/openapi.yaml"
        - "pacts/**"
        - "cmd/hush-hush/web/**"
        - "Dockerfile*"
        - ".dockerignore"
        - ".hadolint.y*ml"
        - "integration/**"
        - "compose.yaml"
        - ".github/workflows/ci.yml"
        - "lefthook.yml"
      run: go test -tags=integration ./integration/... -v
