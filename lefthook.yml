# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.
#
# Grows a job here the same PR that adds the tool it runs — a linter with no
# hook is a linter you only meet at CI.

# pre-commit may write. Let every fixer run and restage what it touched — a
# commit should not fail over a quote style a tool can settle by itself.
pre-commit:
  jobs:
    # gofumpt (a gofmt superset) is what .golangci.yml's formatters actually
    # run - calling plain gofmt here too would be two formatters arguing over
    # the same bytes, the exact thing rules/go-lint.md says not to do.
    #
    # Docker-wrapped, like every other Go hook command below: a host go and
    # golangci-lint drifting apart independently is a real failure mode
    # (go.md), not a hypothetical - hit live on this machine once already.
    # --user keeps the fixer's writes owned by the invoking user, not root;
    # the GOCACHE/GOMODCACHE/GOLANGCI_LINT_CACHE mounts keep a second run
    # from paying a cold cache every time.
    - name: golangci-lint fmt
      glob: "*.go"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        -e GOLANGCI_LINT_CACHE=/lintcache -v "$HOME/.cache/golangci-lint-docker:/lintcache"
        golangci/golangci-lint:v2.13.1@sha256:d371321370bf2907bd13a8f6f8baff0e0ca7438d76fdf636b281eadf7e2305e3
        golangci-lint fmt {staged_files}
      stage_fixed: true

    # --fix only here, not in CI's twin of this job: pre-commit may write and
    # restage, but a rewrite in CI would leave the pushed commit and what CI
    # actually checked disagreeing.
    - name: golangci-lint run
      glob: "*.go"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        -e GOLANGCI_LINT_CACHE=/lintcache -v "$HOME/.cache/golangci-lint-docker:/lintcache"
        golangci/golangci-lint:v2.13.1@sha256:d371321370bf2907bd13a8f6f8baff0e0ca7438d76fdf636b281eadf7e2305e3
        golangci-lint run --fix ./...
      stage_fixed: true

    # go mod edit -fmt is the canonicalizer for go.mod itself: a builtin `go`
    # subcommand, not gofmt (which never touches go.mod) and not `go mod tidy`
    # (which does network resolution a formatting-only hook shouldn't be
    # doing). golang:<go.mod's own go directive>-bookworm, matching the
    # Dockerfile and CI's pin exactly.
    - name: gomod
      glob: "go.mod"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
        go mod edit -fmt go.mod
      stage_fixed: true

    # Prettier decides the layout, markdownlint then judges what Prettier
    # produced. The other order has markdownlint fixing something Prettier is
    # about to overwrite.
    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    # Keeps package.json itself canonical, the same job Prettier does for
    # everything else - Prettier doesn't format JSON key order, only the
    # bytes.
    - name: sort-package-json
      glob: "package.json"
      run: bunx sort-package-json {staged_files}
      stage_fixed: true

    # Fast enough for a commit. LTeX is not — around ten seconds a file — so
    # mechanics run at push instead, where the wait is paid once rather than
    # per commit.
    - name: vale
      glob: "*.md"
      exclude:
        - "CHANGELOG.md"
      run: vale {staged_files}

    # Reads only, so it changes nothing to restage. Invoked bare rather than
    # on {staged_files}: what gets linted is the `apis` list in redocly.yaml,
    # and naming a path here is how the hook and CI end up checking different
    # files. The glob only decides whether it's worth running at all.
    - name: redocly
      glob:
        - "api/*.yaml"
        - "api/*.yml"
        - "api/**/*.yaml"
        - "api/**/*.yml"
        - "redocly.yaml"
      run: bunx redocly lint

    # Pinned by digest rather than `latest`, like any other container image —
    # dependencies.md's rule applies to an image named in a hook command just
    # as much as one named in the Dockerfile itself. Both Dockerfiles get
    # hadolint (containers.md: "every Dockerfile, no exceptions") - passed
    # as file arguments rather than stdin so one invocation covers both.
    - name: hadolint
      glob:
        - "Dockerfile"
        - "Dockerfile.release"
      run: >-
        docker run --rm
        -v "$(pwd)/.hadolint.yaml:/.hadolint.yaml"
        -v "$(pwd)/Dockerfile:/Dockerfile"
        -v "$(pwd)/Dockerfile.release:/Dockerfile.release"
        hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        hadolint Dockerfile Dockerfile.release

commit-msg:
  jobs:
    # Resolved from node_modules rather than fetched by bunx: commitlint has to
    # load the config its own config extends, and bunx cannot resolve a sibling
    # package for it. Run `bun install` if this cannot find itself.
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never writes. A hook rewriting files under a push leaves the pushed
# commit and the working tree disagreeing about what was reviewed.
#
# Parallel because of that: nothing here touches a file, so no job can be
# reading what another is rewriting.
pre-push:
  parallel: true
  jobs:
    # Docker-wrapped, same reasoning and pin as pre-commit's Go jobs above.
    - name: test
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
        go test ./...

    # No check-only flag on `go mod edit -fmt`, so the gate is running it
    # again and diffing. A no-op on a go.mod pre-commit already canonicalized;
    # only fails if that got bypassed. Only the edit itself needs Docker -
    # the mount is live, not a copy, so the diff check right after runs
    # against the host's own git same as any other pre-push job here.
    - name: gomod
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
        go mod edit -fmt go.mod
        && git diff --exit-code go.mod

    # These are `package.json` scripts rather than the commands spelled out,
    # because CI runs the same ones and a literal copied into two files drifts
    # the first time somebody edits one of them.
    - name: prettier
      run: bun run format:check

    - name: markdownlint
      run: bun run lint:md

    # Every other linter here runs at commit, at push and in CI. Vale ran at
    # commit and then nothing until CI, because its invocation lived in the
    # workflow as a block of bash with nothing a hook could reuse. It is a
    # script now, and this is the whole-tree run that was missing.
    - name: vale
      run: bun run lint:prose

    # Grammar and spelling. Left out of pre-commit on the grounds that it is a
    # ~300 MB download, which it is — but it caches outside the repository and
    # then costs about ten seconds.
    - name: mechanics
      run: bun run lint:mechanics

    - name: redocly
      run: bun run lint:api

    - name: sort-package-json
      run: bun run lint:package-json

    # A strict superset of a bare `docker build`: testcontainers-go builds
    # the same Dockerfile, then actually starts the container and proves
    # it serves real requests - the packaged distroless artifact, not the
    # server's Go code run directly the way every other test here does.
    #
    # Deliberately NOT Docker-wrapped, unlike every other Go job above:
    # testcontainers-go needs a real Docker daemon to build and run
    # against, which the host already has - wrapping this command in
    # another container would need Docker-outside-of-Docker (mounting
    # /var/run/docker.sock into it) for no benefit over just not nesting,
    # the same reasoning ci.yml's own container-integration job gives for
    # staying off a `container:` runner.
    - name: container-integration
      run: go test -tags=integration ./integration/... -v
