version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Every bun devDependency here is pure tooling (prettier,
      # markdownlint, redocly, commitlint, lefthook, sort-package-json) -
      # none of it ships in the released Go binary or container image, so
      # releases.md's fix: rationale (a change to what ships) doesn't hold
      # for this repo's bun ecosystem specifically.
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
