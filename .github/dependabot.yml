# Commit prefixes decide what releases (rules/release-bots.md): `fix` cuts a
# patch release for a dependency that ships, `chore` and `ci` release nothing.
# Each ecosystem has a minor-and-patch group and a separate major group. A
# grouped update gets Dependabot's lowercase title ("bump the ... group"),
# which passes commitlint's subject-case rule; an ungrouped one is
# sentence-case and doesn't. The major group stays separate so one pull
# request never bundles a major bump with unrelated minor ones.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Every bun devDependency here is pure tooling (prettier,
      # markdownlint, redocly, commitlint, lefthook, sort-package-json) -
      # none of it ships in the released Go binary or container image, so
      # releases.md's fix: rationale (a change to what ships) doesn't hold
      # for this repo's bun ecosystem specifically.
      prefix: chore
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  # The web UI has its own package.json and bun.lock, and it ships: the build
  # compiles it into the SPA the Go binary embeds. Nothing watched it before.
  - package-ecosystem: bun
    directory: /cmd/hush-hush/web
    schedule:
      interval: weekly
    commit-message:
      # No prefix-development split, unlike the usual dev/prod one. A bundled
      # SPA compiles most of its devDependencies into what ships (svelte, the
      # icon set, the date library bits-ui builds on), so package.json's
      # section doesn't say what reaches a user. Plain `fix` can cut a patch
      # release for a test-tool bump that didn't need one, which costs far less
      # than a vulnerable dependency that's merged and never released.
      prefix: fix
    # TypeScript 7 is the native port and has no JS compiler API, which
    # openapi-typescript (generate:api) and svelte-check both call: on 7.0.2
    # each one crashes. Dependabot can't split a group per dependency, so one
    # unusable major would hold every other major in the group red
    # (alrayyes/hush-hush#622). Lift this once both tools support TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  # compose.yaml pins the published image by tag and digest, and this is what
  # keeps that pin current. compose.build.yaml names only a local build.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
