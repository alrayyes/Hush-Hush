# The two tiers markdownlint doesn't cover.
#
# Layout is Prettier and structure is markdownlint, both in the ci workflow.
# Those pass a document that reads badly: neither notices "an university",
# "the the", or a paragraph that has quietly gone passive.
#
# Mechanics and style are separate jobs on purpose. When this goes red the
# job name should say which tier failed, because a grammar mistake and a
# style opinion are answered differently — one is wrong, the other is a
# suggestion.
name: prose

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - scripts/lint-prose.sh
      - scripts/lint-mechanics.sh
      - scripts/vale.sh
      - .github/workflows/prose.yml
  pull_request:
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - scripts/lint-prose.sh
      - scripts/lint-mechanics.sh
      - scripts/vale.sh
      - .github/workflows/prose.yml

permissions:
  contents: read

concurrency:
  group: prose-${{ github.ref }}
  cancel-in-progress: true

# ltex-ls-plus is pinned inside scripts/lint-mechanics.sh, so the hook and this
# workflow cannot install different versions of it. Vale's own image is pinned
# on the `style` job below, and its style packages are fetched by `vale sync`.

jobs:
  # Mechanics: grammar, spelling, the phonetic article. These have a right
  # answer, so this one fails the build.
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus@sha256:bf8c54087ad5418da57d9ef5a9604b4dd70aa0737fa0d732b2a2d5cd81e64c18 # 18.7.0
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the prose this repository owns
        # The same script the pre-push hook runs, so the two cannot disagree
        # about the version, the file list or what counts as a failure.
        run: ./scripts/lint-mechanics.sh

  style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # The official image, not `go install`: that needs a Go toolchain and
      # breaks when Vale moves its module path. The image is Alpine with
      # /bin/vale as its entrypoint, runs as root and ships node but not git
      # or bash, hence the entrypoint override and the apk step below.
      image: jdkato/vale:v3.17.1@sha256:7dba3c9104ba366f172d119022c4ec53a005f7d14dc1b80e285421a3f0b71657 # renovate: datasource=docker depName=jdkato/vale
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache bash git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vale
        # The same script the pre-push hook runs, so the two cannot check
        # different files or disagree about what's worth failing on.
        env:
          VALE_REPORT: vale.txt
        run: ./scripts/lint-prose.sh
      - name: Report
        if: always()
        run: |
          {
            echo '### Vale'
            echo
            if [ -s vale.txt ]; then
              echo '```'
              cat vale.txt
              echo '```'
            else
              echo 'Nothing to report.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
