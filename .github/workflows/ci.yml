# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      # Version-pinned by the image tag itself, so there's nothing separate
      # to keep in sync with a golangci-lint-action version. This image is
      # built FROM golang, so `go` and `gofmt` are on PATH too.
      image: golangci/golangci-lint:v2.13.1@sha256:d371321370bf2907bd13a8f6f8baff0e0ca7438d76fdf636b281eadf7e2305e3
    steps:
      # actions/checkout is a JavaScript action and needs node; installing
      # git pulls in the need for ca-certificates too, since git reads the
      # system CA store a minimal image hasn't got.
      - run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache ca-certificates git nodejs
          else
            apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: golangci-lint fmt
        # --diff reports rather than rewrites here; this is the check that a
        # file was committed unformatted.
        run: golangci-lint fmt --diff
      - name: golangci-lint run
        run: golangci-lint run

  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: go test
        # -coverpkg=./..., not the default: without it, coverage only counts
        # each package's own tests, and a thin handler package under-reports
        # since the logic it calls lives elsewhere.
        run: go test -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tail -1 |
            awk '{ print "**Coverage: " $3 "**" }' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        # GitHub withholds repository Actions secrets from a Dependabot
        # pull_request run - CODECOV_TOKEN included - so this step would
        # otherwise fail every Dependabot PR with "token required because
        # branch is protected", regardless of what the PR actually
        # changes. go test above still ran and still gates the PR; only
        # the coverage report, which needs the missing token, is skipped.
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # Pact's Go binding statically links a native library into the test
  # binary at link time - present or not, whether or not a Pact test
  # actually runs - so this stays its own job rather than folding into
  # `test`, which has no such dependency and shouldn't gain one just
  # because this package now imports pact-go behind a build tag.
  pact:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
    env:
      PACT_DO_NOT_TRACK: "true"
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: go install github.com/pact-foundation/pact-go/v2@v2.7.1
      - run: pact-go install
      # Consumer first, provider second, as two separate invocations -
      # never `go test -tags=pact ./...` for both packages together, which
      # starts them as independent test binaries with no ordering
      # guarantee between them: the provider test reads the pact file the
      # consumer test writes, and letting them run concurrently risks the
      # provider reading it mid-write.
      - name: consumer tests (writes pacts/*.json)
        run: go test -tags=pact ./internal/client/... -v
      - name: provider verification (reads pacts/*.json)
        run: go test -tags=pact ./internal/api/... -run TestPactProviderVerification -v

  build:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: go build ./...

  # Pinning a dependency stops it drifting; it says nothing about the
  # pinned version having a known CVE since. Separate from the update PR
  # Dependabot raises - this runs on every push, whatever's pinned right
  # now.
  govulncheck:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  # No check-only flag on `go mod edit -fmt`, so this is the pre-commit
  # fixer's twin from lefthook.yml: run it again and diff.
  gomod:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: go mod edit -fmt
        run: go mod edit -fmt go.mod && git diff --exit-code go.mod

  # goreleaser's config is validated here without cutting a release - a typo
  # in .goreleaser.yml otherwise only surfaces the day a release actually
  # runs. No container/Go toolchain needed: `check` only reads the config,
  # and goreleaser-action fetches a prebuilt, checksum-verified binary
  # instead of `go install`-ing the whole tool from source on every run.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: check

  # `goreleaser check` above only validates the config; this actually
  # builds the nfpm packages via a --snapshot release (no publish, no real
  # tag needed) and installs each into the distro it targets, so a broken
  # .deb/.rpm - a bad contents: path, a missing man page - fails here
  # instead of on the first real release. docker/announce/publish need
  # real credentials or a real tag, neither of which a snapshot has -
  # skipping them is what makes this safe to run on every push and pull
  # request.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=docker,announce,publish

      - name: install and smoke-test the .deb
        run: |
          sudo dpkg -i dist/hush-hush-cli_*_linux_amd64.deb
          hush-hush-cli --version
          test -s /usr/share/man/man1/hush-hush-cli.1

      # No native rpm tooling on ubuntu-latest - a Fedora container is the
      # least-friction way to actually install and run the package, not
      # just inspect its file list.
      - name: install and smoke-test the .rpm
        run: |
          docker run --rm -v "$PWD/dist:/dist" \
            fedora@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d \
            sh -c '
              rpm -i /dist/hush-hush-cli_*_linux_amd64.rpm &&
              hush-hush-cli --version &&
              test -s /usr/share/man/man1/hush-hush-cli.1
            '

  # hadolint runs as the job's own container rather than via `docker run`
  # from inside another one — no Docker-outside-of-Docker needed at all.
  # Must be the `-alpine` tag specifically: the default hadolint image is
  # `FROM scratch`, no shell, and can't run a checkout step.
  dockerfile:
    runs-on: ubuntu-latest
    container:
      image: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
    steps:
      # hadolint never shells out to git, so unlike every other job here it
      # doesn't need the safe.directory fix (or git installed at all).
      - run: apk add --no-cache nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: hadolint Dockerfile Dockerfile.release

  # No container: block, deliberately - testcontainers-go needs a real
  # Docker daemon to build and run against, which the bare runner already
  # has; a nested container job would need its own Docker-outside-of-Docker
  # setup for no benefit over just not nesting at all.
  container-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -tags=integration ./integration/... -v

  # Layout and structure. Style and mechanics are prose.yml — see its header
  # comment for why they're split out.
  #
  # Pinned below 1.4, matching package.json's own packageManager: bun 1.4
  # made lockfileVersion 2 the default bun.lock format, and Dependabot's
  # bundled bun updater still ships 1.3.5, which can't parse it and
  # silently corrupts it back to v1 instead of erroring
  # (dependabot/dependabot-core#15848). Every bun job here stays on the
  # same pin so nothing writes a v2 lockfile out from under Dependabot.
  prose:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed. --ignore-scripts skips
        # the `prepare` script (`lefthook install`) — hooks are a local dev
        # convenience with nothing to do in a one-shot CI container.
        run: bun install --frozen-lockfile --ignore-scripts
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # The API description is a contract. This proves the document is valid
  # OpenAPI; nothing here proves the handler still matches it — see
  # CONTRIBUTING.md's "The contract" section for the gap.
  api:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: redocly lint
        run: bun run lint:api

  # Same reasoning as govulncheck above, for the bun ecosystem: pinning
  # stops it drifting, not a known CVE in whatever's pinned right now.
  bun-audit:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
