# The dependency audits, on a clock. ci.yml runs `govulncheck` and `bun-audit`
# only when a pull request touches the files they cover (a new advisory
# shouldn't turn every unrelated PR red), which leaves nothing watching a
# pinned version between dependency changes. This runs just those two daily and
# turns a failure into an issue, since nobody reads a red scheduled run.
#
# Dependabot security updates are on for this repo and raise a PR for an
# advisory that has a fix, but they say nothing about one without a fix, and
# govulncheck's call-graph reachability is its own signal. This is the
# notification, not a second updater.
#
# The commands and image digests mirror the jobs of the same names in ci.yml;
# keep them in step. They run through `docker run` on the runner rather than as
# a job container so `gh`, which the failure step needs, is on PATH.
name: audit

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: govulncheck
        shell: bash
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61 \
            sh -c 'go install golang.org/x/vuln/cmd/govulncheck@v1.7.0 && govulncheck ./...' 2>&1 | tee "$RUNNER_TEMP/audit.txt"
      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/audit-issue.sh govulncheck "$RUNNER_TEMP/audit.txt"

  # braces advisory ignored for the reason given on ci.yml's bun-audit job.
  bun-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bun audit
        shell: bash
        run: |
          docker run --rm --entrypoint "" -v "$PWD":/src -w /src \
            oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0 \
            sh -c 'bun install --frozen-lockfile --ignore-scripts && bun audit --ignore=GHSA-vfj7-8cjw-p6xm' 2>&1 | tee "$RUNNER_TEMP/audit.txt"
      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/audit-issue.sh bun-audit "$RUNNER_TEMP/audit.txt"
