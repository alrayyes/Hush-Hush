# release-please decides the version and cuts the tag; goreleaser builds and
# attaches the binaries. A tag release-please pushes with the default
# GITHUB_TOKEN starts no further workflow (GitHub refuses, to stop recursive
# runs) — so goreleaser has to be a second job in this same workflow, gated
# on release-please's own `release_created` output, not a separate
# `on: push: tags:` workflow that would silently never fire.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # arm64 has no native runner here, so its image builds under QEMU
      # emulation - cheap now that Dockerfile.release only COPYs a binary
      # goreleaser already cross-compiled natively (go-releases.md),
      # rather than running `go build` itself under emulation.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser-action fetches a prebuilt, checksum-verified binary
      # instead of `go install`-ing the whole tool from source on every run.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          # goreleaser's GitHub-shaped defaults resolve here without any
          # override block - unlike the gitea_urls/force_token this repo
          # needed when it lived on Forgejo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Free SLSA Build L2 provenance tying these binaries to this workflow
      # run - releases.md: adopt unconditionally, no cosign/SBOM needed yet.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
