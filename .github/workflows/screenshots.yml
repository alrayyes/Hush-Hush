# Regenerates the README's light/dark web UI screenshots against the
# binary a real release just published, and opens a pull request if
# they changed - never a direct commit, per CLAUDE.md's "no unattended
# tooling commits except the release job itself, scoped to the version
# bump and changelog only" (alrayyes/hush-hush#266).
name: screenshots

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Cheap enough (checkout + one git diff, no build/browser/server) to run
  # ahead of the real capture job and skip it outright when nothing under
  # cmd/hush-hush/web/ moved -- a release cut purely from the object-store
  # backend or a dependency bump was still paying for a full
  # build+browser+capture cycle every time to produce byte-identical
  # images add-paths further down would just leave uncommitted anyway.
  check-ui-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev_tag=$(gh release list --limit 2 --json tagName -q '.[1].tagName // empty')
          if [ -z "$prev_tag" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT" # no prior release to diff against
          elif git diff --quiet "$prev_tag"..HEAD -- cmd/hush-hush/web/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  screenshots:
    needs: check-ui-changed
    if: needs.check-ui-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
        working-directory: cmd/hush-hush/web
      - run: bun run build
        working-directory: cmd/hush-hush/web
      - run: bunx playwright install --with-deps chromium
        working-directory: cmd/hush-hush/web

      - name: Start the real server
        working-directory: cmd/hush-hush/web
        run: |
          bash e2e/server.sh &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4173/healthz && break
            sleep 1
          done

      - run: bun run screenshots
        working-directory: cmd/hush-hush/web

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          base: main
          commit-message: "docs: update README screenshots for ${{ github.event.release.tag_name }}"
          title: "docs: update README screenshots for ${{ github.event.release.tag_name }}"
          body: |
            Regenerated against ${{ github.event.release.tag_name }} by the
            `screenshots` workflow - light and dark, seeded with sample
            secret objects. Opens only when the images actually changed.
          branch: docs/screenshots-update
          delete-branch: true
          add-paths: docs/screenshots/*.png
