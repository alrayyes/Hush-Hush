# The contract, and the only machine-readable description of it. Hand-written
# and committed rather than generated from handler annotations - the spec is
# reviewed as the design, and the handlers in internal/api are written
# against it, not the other way round. See
# openspec/changes/secrets-object-store/ for the design this implements.
openapi: 3.1.0

info:
  title: Hush Hush
  summary: A standalone secrets object store.
  description: |
    A writer only ever needs the service's public key to add or rotate a
    value; a consumer only ever needs an object's slug to fetch it. Every
    object is sealed (age) to one or more recipients chosen at write time -
    the service stores and serves ciphertext only, and never computes or
    returns plaintext.

    v1's read path is deliberately flat: fetching an object's ciphertext
    needs no authorization, only its slug. The confidentiality boundary is
    entirely "who holds a matching private key" - every fetch is recorded
    to the audit log instead, which is what answers "did anyone access
    this" during a rotation or incident. Writes (create, update, delete)
    are gated by a bearer token.

    A separate web UI adds a second, human-facing way in: a single admin
    account authenticates with a WebAuthn passkey and gets a browser
    session, used only by the `/auth/*`, `/credentials/*`, and `/tokens/*`
    endpoints below - it never substitutes for the bearer token the
    `objects`/`audit-log` endpoints above require. WebAuthn needs a fixed
    relying-party ID and origin, so a deployment that enables the web UI
    sets a new `PUBLIC_URL` environment variable (see the server's own
    README) - unset, every `/auth/*` endpoint responds with a
    configuration error rather than guessing a host from request headers.
  version: 0.1.0
  contact:
    name: Hush Hush
    url: https://github.com/alrayyes/hush-hush

servers:
  - url: "{scheme}://{host}"
    x-internal: false
    description: |
      No canonical host - this is meant to run anywhere, not just one
      environment: local, staging or production.
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: localhost:8080
        description: The default listen address. Set ADDR to change it.

security: []

tags:
  - name: health
    description: Liveness, for whatever supervises the process.
  - name: objects
    description: Sealed secret objects - create, fetch, update, delete.
  - name: audit-log
    description: The record of every read and write against an object.
  - name: mcp
    description: |
      MCP (Model Context Protocol) tools mirroring the objects endpoints,
      for an MCP-capable agent (docs/adr/0019-mcp-endpoint.md).
  - name: consumers
    description: |
      Distinct `used_by` consumer names already recorded across every
      object - for the web UI's create/edit form to offer instead of
      free-text recall.
  - name: auth
    description: |
      WebAuthn passkey registration and login for the single admin
      account, and the browser session that results.
  - name: credentials
    description: Managing the admin account's registered passkeys.
  - name: tokens
    description: |
      HTTP management of write bearer tokens - create, list, revoke -
      for the web UI's settings page. Session-gated, distinct from the
      tokens themselves, which still authenticate the `objects` write
      path above.

paths:
  /healthz:
    get:
      operationId: health
      summary: Liveness
      description: |
        Answers 200 unconditionally. There's nothing behind this service to
        be unavailable.
      tags: [health]
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: "2.6.0"

  /readyz:
    get:
      operationId: ready
      summary: Readiness
      description: |
        Answers 200 when the database can serve a request and 503 when it
        can't, or when the server is shutting down. The container image's
        own health check asks this, so a container whose database has become
        unusable shows as unhealthy, where `/healthz` would stay green
        because the process is still up. Unauthenticated like `/healthz`,
        so a failure never says why - the reason goes to the server's log.

        The database check is given 2 seconds and its answer is reused for
        about 3, so a burst of probes costs one database call and a hung
        database reads as not ready instead of hanging the probe. On
        SIGTERM the server answers 503 here at once and keeps serving for 3
        seconds before it stops accepting connections, so a load balancer
        stops sending traffic first and the requests already on their way
        aren't refused. `/healthz` stays 200 throughout.
      tags: [health]
      responses:
        "200":
          description: The database answered a ping and a read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
              example:
                status: ok
        "503":
          description: The database could not serve a request, or the server is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
              example:
                status: unavailable

  /objects:
    get:
      operationId: listObjects
      summary: List stored objects
      description: |
        Returns every stored object's metadata (slug, used_by, tags,
        description, and who created and last updated it and when) - never
        the sealed value, and never the internal id as something
        addressable. Gated by a write token or a session unlike every
        other read path here: a slug-scoped read only ever discloses what
        a caller already knows the slug of, but enumerating every object
        is a capability none of those reads grant on their own. The web UI
        holds a session, never a bearer token, and uses this for its
        secrets overview - the two credentials are equally valid here
        (auth/spec.md's "A session authenticates secret-object access"
        requirement).
      tags: [objects]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: used_by
          in: query
          required: false
          description: Restrict to objects whose recorded used_by lineage includes this consumer.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: |
            Restrict to objects carrying this tag. Repeat the parameter to
            require several - an object must carry every one. Matched
            case-insensitively.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Tag"
          style: form
          explode: true
      responses:
        "200":
          description: Matching objects' metadata, sorted by slug.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createObject
      summary: Create a new sealed object
      description: |
        Stores an already-sealed value under a new, caller-chosen slug -
        the object's own internal id is generated server-side and never
        returned as something addressable. The service never decrypts the
        value, and it can't know how many recipients it was sealed to or
        whether any key is right. It does read the age header: a value
        that isn't base64 of a well-formed age file, or whose header
        names no recipient, is a 422 and nothing is stored. A session-
        authenticated call needs its CSRF token too; a bearer-token-
        authenticated one doesn't, since there's no session to have one.
      tags: [objects]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/caller"
        - $ref: "#/components/parameters/csrfTokenOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObjectRequest"
            example:
              slug: mattermost_deploy_webhook
              value: YWdlLWVuY3J5cHRpb24ub3JnL3Yx
              used_by: [homelab/vps-docker]
      responses:
        "201":
          description: The object was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "409":
          description: An object already exists under that slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: object already exists

  /objects/{slug}:
    get:
      operationId: getObject
      summary: Fetch an object's sealed ciphertext
      description: |
        Returns the stored ciphertext exactly as sealed, byte for byte -
        the service never decrypts it. Requires a write bearer token, an
        admin session, or a consumer read token whose bound consumer
        appears in this object's `used_by` list - the confidentiality
        boundary is still "who holds a matching private key," this adds
        an access-control layer on top of it
        (openspec/changes/consumer-read-tokens/proposal.md). Every fetch
        is recorded to the audit log regardless of which credential
        authenticated it.

        A consumer token presented for an object outside its scope gets
        the same 404 an unknown slug would, not 403 - so it can't be used
        to enumerate which other slugs exist.
      tags: [objects]
      security:
        - bearerAuth: []
        - cookieAuth: []
        - consumerBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/caller"
      responses:
        "200":
          description: The sealed object.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateObject
      summary: Rotate an object's value
      description: |
        Replaces the stored ciphertext for an existing object. The new
        value is checked the same way a created one is: not base64 of a
        well-formed age file, or no recipient in its header, is a 422
        and the stored value is left alone. The
        object's slug and description metadata are always preserved
        unchanged. used_by is preserved too, unless the request body
        includes it - in which case it fully replaces the object's
        recorded consumers, the same way creating an object sets it. A
        session-authenticated call needs its CSRF token too; a
        bearer-token-authenticated one doesn't.
      tags: [objects]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/caller"
        - $ref: "#/components/parameters/csrfTokenOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateObjectRequest"
            example:
              value: YWdlLWVuY3J5cHRpb24ub3JnL3Yx
      responses:
        "200":
          description: The object's value was replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteObject
      summary: Remove an object
      description: |
        Permanently removes an object. A subsequent fetch by this slug
        returns 404. A session-authenticated call needs its CSRF token
        too; a bearer-token-authenticated one doesn't.
      tags: [objects]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/caller"
        - $ref: "#/components/parameters/csrfTokenOptional"
      responses:
        "204":
          description: The object was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /objects/{slug}/used-by:
    get:
      operationId: getObjectUsedBy
      summary: Query what depends on an object
      description: |
        Returns the recorded list of consumers (repos or hosts) for an
        object - the "what depends on this" mapping, kept queryable rather
        than left as an implied convention.
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: The object's recorded consumers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsedBy"
              example:
                used_by: [homelab/vps-docker]
        "404":
          $ref: "#/components/responses/NotFound"

  /consumers:
    get:
      operationId: listConsumers
      summary: List every distinct recorded consumer
      description: |
        Returns every distinct consumer name currently present in any
        object's `used_by` list - gated the same way `GET /objects` is (a
        write token or a session), since listing needs no id the caller
        already holds.

        Called with none of `q`, `page`, or `page_size`, it returns the
        original plain, unpaginated array of names, sorted, with no
        duplicates - `consumer-combobox`'s (alrayyes/hush-hush#251) own
        call site depends on this shape staying unchanged. Given any of
        the three, it instead returns a `ConsumersPage`: one page of
        consumers whose name contains `q` (case-insensitive) when given,
        each with a count of the secret objects that reference it and its
        registered age public key when one has been set (absent
        otherwise), plus the total matching count so a caller can render
        page-number navigation.
      tags: [consumers]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Restrict to consumers whose name contains this substring, case-insensitive.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based page number. Given alone or with the other two, triggers the paginated response shape.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: page_size
          in: query
          required: false
          description: Maximum consumers per page. Defaults to 20, capped at 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: |
            Every distinct consumer name (no parameters given), or one
            page of consumers matching the filter, each with its secret
            count and registered public key (if any), plus the total
            matching count (any parameter given).
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: string
                  - $ref: "#/components/schemas/ConsumersPage"
              examples:
                unpaginated:
                  summary: No parameters given
                  value: [homelab/mattermost, homelab/vps-docker]
                paginated:
                  summary: page given
                  value:
                    consumers:
                      - name: homelab/mattermost
                        secret_count: 2
                      - name: homelab/vps-docker
                        secret_count: 1
                        public_key: age1exampleplaceholderpublickey
                    total: 2
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: addConsumer
      summary: Add a consumer with no secret referencing it yet
      description: |
        Adds `name` to the directory (`alrayyes/hush-hush#324`) without
        requiring any object's `used_by` list to reference it first -
        unlike every other consumer here, which only ever exist because
        some object's `used_by` recorded them. The new entry appears in
        `GET /consumers` with a `secret_count` of 0 until something
        actually uses it. A session-authenticated call needs its CSRF
        token too; a bearer-token-authenticated one doesn't.
      tags: [consumers]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/csrfTokenOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddConsumerRequest"
            example:
              name: homelab/new-device
      responses:
        "201":
          description: The consumer was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerEntry"
              example:
                name: homelab/new-device
                secret_count: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ConsumerAlreadyExists"

  /consumers/{name}:
    patch:
      operationId: updateConsumer
      summary: Rename a consumer and/or register its public key
      description: |
        Consumers aren't a stored resource of their own (`alrayyes/hush-hush#282`,
        following ADR 0002's deferred consumer-identity decision) - a
        `name` in the request body replaces `name` in every stored
        object's `used_by` list that currently records it, the same as
        before this endpoint also took `public_key`. An object already
        recording the target name keeps a single entry, not a duplicate.
        If the target name already has its own recorded objects, they
        merge under it: the response's `secret_count` reflects every
        object now recording the new name, old and already-there
        combined. Renaming an unknown name is rejected with a 404.

        A `public_key` in the request body registers or replaces that age
        public key on the (possibly just-renamed) consumer, upserting a
        directory entry for it even if it had none before - unlike a bare
        rename, this never 404s on an unrecognized name. Sending both
        fields in the same call renames first, then sets the key on the
        resulting name.

        A session-authenticated call needs its CSRF token too; a
        bearer-token-authenticated one doesn't.
      tags: [consumers]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/consumerName"
        - $ref: "#/components/parameters/csrfTokenOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConsumerRequest"
            examples:
              rename:
                summary: Rename only
                value:
                  name: homelab/vps-docker-2
              registerPublicKey:
                summary: Register a public key only
                value:
                  public_key: age1exampleplaceholderpublickey
      responses:
        "200":
          description: The consumer was updated; the resulting entry under its (possibly new) name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerEntry"
              example:
                name: homelab/vps-docker-2
                secret_count: 3
                public_key: age1exampleplaceholderpublickey
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownConsumer"

    delete:
      operationId: deleteConsumer
      summary: Remove a consumer from every object that references it
      description: |
        Strips `name` from the `used_by` list of every stored object that
        currently records it - the objects themselves aren't touched
        otherwise, and none are deleted even if this empties their
        `used_by` list. A subsequent `GET /consumers` no longer lists this
        name. A session-authenticated call needs its CSRF token too; a
        bearer-token-authenticated one doesn't.
      tags: [consumers]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/consumerName"
        - $ref: "#/components/parameters/csrfTokenOptional"
      responses:
        "204":
          description: The consumer was removed from every object that referenced it.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownConsumer"

  /audit-log:
    get:
      operationId: queryAuditLog
      summary: Query the audit log
      description: |
        Every create, read, update, and delete call is recorded here -
        this is what answers "did anyone fetch this ciphertext" during a
        rotation or incident, since v1 has no pre-fetch access check.
        Filters combine with AND when more than one is given.
      tags: [audit-log]
      parameters:
        - name: object_id
          in: query
          required: false
          description: Restrict to entries for this object id.
          schema:
            $ref: "#/components/schemas/ObjectSlug"
        - name: caller
          in: query
          required: false
          description: Restrict to entries recorded with this caller identity.
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: |
            Restrict to entries authenticated by this verified actor - a
            token id, or the admin account's own actor_id. Unlike caller,
            this is never self-reported. The literal value `none` is a
            sentinel matching an unauthenticated read (no real actor_id
            ever takes that value) - `GET /audit-log/filter-options`
            returns it as one of the actor filter's own selectable
            values, alongside every real actor.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Restrict to entries at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Restrict to entries at or before this time.
          schema:
            type: string
            format: date-time
        - name: after
          in: query
          required: false
          description: |
            Cursor: restrict to entries recorded after this entry's own
            id. Combine with limit to page forward through a large log -
            id-based rather than offset-based, so a concurrent write
            during paging can't shift or double-count a row
            (design.md's "Audit log UI" decision).
          schema:
            type: integer
            format: int64
        - name: order
          in: query
          required: false
          description: |
            Sort direction by entry id. `asc` (the default) is oldest
            first; `desc` is newest first, so combined with limit it
            returns the newest entries - `?object_id=x&order=desc&limit=3`
            is an object's three latest events.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          required: false
          description: Maximum entries to return. Defaults to 50, capped at 500.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Matching audit log entries, one page - oldest first unless `order=desc`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"

  /audit-log/filter-options:
    get:
      operationId: queryAuditLogFilterOptions
      summary: List the values GET /audit-log's own filters can select from
      description: |
        Returns every distinct object id, actor, and caller currently
        recorded in the audit log - computed from the audit log itself,
        not from `GET /objects`'s currently-existing objects, since an
        audit entry outlives the object it's about by design. Backs the
        web UI's object-id and actor/caller filter select boxes with
        values that actually appear in the log, rather than a free-text
        guess.
      tags: [audit-log]
      responses:
        "200":
          description: The distinct object ids, actors, and callers recorded in the audit log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogFilterOptions"
              example:
                object_ids: [mattermost_deploy_webhook]
                actors:
                  - value: admin
                    label: admin
                  - value: a1b2c3d4e5f6a7b8
                    label: "token:a1b2c3d4e5f6a7b8"
                  - value: none
                    label: none
                callers: [homelab/vps-docker]

  /mcp:
    post:
      operationId: mcp
      summary: MCP (Model Context Protocol) endpoint
      description: |
        Serves the MCP Streamable HTTP transport - JSON-RPC 2.0 messages
        exchanging tool calls with an MCP-capable client
        (https://modelcontextprotocol.io). Exposes five tools mirroring
        hush-hush-cli's own operations one-to-one: inject, get, update,
        delete, list (docs/adr/0019-mcp-endpoint.md).

        Gated the same way every other write route is, applied uniformly
        across all five tools - including get and list, which are
        unauthenticated (get) or write-token-or-session-gated (list) over
        their plain HTTP equivalents. One authenticated MCP session
        performs all five operations, rather than each tool reproducing
        its HTTP twin's own auth shape.

        The request and response bodies are MCP's own JSON-RPC 2.0
        envelope, not described further here - OpenAPI can't usefully
        express per-tool dynamic dispatch. The real per-tool contract is
        the JSON Schema each tool's Go input/output type generates at
        compile time, discoverable from a running server's own
        `tools/list` call, not from this document.
      tags: [mcp]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: An MCP JSON-RPC 2.0 request.
      responses:
        "200":
          description: An MCP JSON-RPC 2.0 response, or an event stream of one or more of them.
          content:
            application/json:
              schema:
                type: object
                description: An MCP JSON-RPC 2.0 response.
            text/event-stream:
              schema:
                type: string
                description: One or more MCP JSON-RPC 2.0 responses, streamed as server-sent events.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/register/begin:
    post:
      operationId: beginRegistration
      summary: Begin passkey registration
      description: |
        Starts a WebAuthn registration ceremony and returns the
        credential-creation options a browser passes to
        `navigator.credentials.create()`. Anonymous when no admin account
        exists yet (this is how the account is first created); requires a
        valid session otherwise, since adding a passkey to an existing
        account shouldn't be reachable by an unauthenticated caller.
      tags: [auth]
      security:
        - {}
        - cookieAuth: []
      responses:
        "200":
          description: Registration options for the browser's WebAuthn ceremony.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/register/finish:
    post:
      operationId: finishRegistration
      summary: Complete passkey registration
      description: |
        Verifies the browser's attestation response and stores the new
        credential. The first successful call (no admin account yet)
        creates the account; every later call adds another credential to
        it. Issues a new session either way.
      tags: [auth]
      security:
        - {}
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationFinishRequest"
      responses:
        "201":
          description: The credential was stored and a session issued.
          headers:
            Set-Cookie:
              description: The new session cookie, and a second, readable csrf_token cookie carrying its CSRF token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/login/begin:
    post:
      operationId: beginLogin
      summary: Begin passkey login
      description: |
        Starts a WebAuthn login ceremony and returns the credential-request
        options a browser passes to `navigator.credentials.get()`.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Login options for the browser's WebAuthn ceremony.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOptions"
        "400":
          description: No admin account has registered a passkey yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no admin account registered yet

  /auth/login/finish:
    post:
      operationId: finishLogin
      summary: Complete passkey login
      description: |
        Verifies the browser's assertion response against a registered
        credential and, on success, issues a session. Also rejects a
        credential whose signature counter didn't advance, a sign a
        cloned authenticator was used.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginFinishRequest"
      responses:
        "204":
          description: The assertion was verified and a session issued.
          headers:
            Set-Cookie:
              description: The new session cookie, and a second, readable csrf_token cookie carrying its CSRF token.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: |
        Invalidates the session presented with the request. State-changing
        and session-authenticated, so it requires the session's own CSRF
        token echoed back in a header, on top of the cookie itself - the
        gap `SameSite=Lax` alone leaves open.
      tags: [auth]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "204":
          description: The session was invalidated.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/status:
    get:
      operationId: getAuthStatus
      summary: Report whether an admin account exists yet
      description: |
        A read-only, side-effect-free check the login page uses to decide
        whether to offer registering the first passkey or logging in with
        one - no cookie set, no ceremony started. Leaks nothing new:
        `POST /auth/login/begin` already reveals this same boolean today
        via its 400 error body
        (openspec/changes/gate-passkey-registration-ui/design.md).
      tags: [auth]
      security: []
      responses:
        "200":
          description: Whether an admin account has been created yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /auth/identity:
    get:
      operationId: getOwnerIdentity
      summary: Report the calling session's escrowed identity public key
      description: |
        The web UI's create/edit dialog reads this to offer the owner's
        own public key as an additional sealing recipient when the
        owner-recipient opt-in checkbox is checked
        (specs/secret-objects/spec.md's "Opt-in owner-recipient inclusion
        at create time" requirement). An SDK client reads it too, with a
        write bearer token and no session, to honour `keep_readable_copy`
        on a create or update: the key is the same whichever credential
        asks, since there is one user to read it from. Credentialed,
        unlike `GET /auth/status`: an age public key isn't secret on its
        own, but every other endpoint that exposes stored data
        (`GET /consumers` included) stays behind a session or bearer
        token, and this keeps that same posture rather than carving out
        an exception.
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: |
            The owner's escrowed identity public key, empty if the user
            hasn't completed a first registration yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /credentials:
    get:
      operationId: listCredentials
      summary: List registered passkeys
      description: |
        Returns every credential registered to the admin account -
        nickname, timestamps, never the public key material.
      tags: [credentials]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The admin account's registered credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /credentials/{id}:
    patch:
      operationId: renameCredential
      summary: Rename a passkey
      tags: [credentials]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/credentialId"
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRenameRequest"
      responses:
        "200":
          description: The credential's nickname was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteCredential
      summary: Remove a passkey
      description: |
        Permanently removes a credential. Refused when it's the only one
        remaining - a passkey the account can't log in with is never left
        as its last one.
      tags: [credentials]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/credentialId"
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "204":
          description: The credential was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This is the only remaining credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: cannot remove the last remaining passkey

  /tokens:
    post:
      operationId: createToken
      summary: Create a write bearer token
      description: |
        Issues a new write-path bearer token, owned by the admin account
        that created it. The raw token value is returned here only - it
        is never recoverable again once this response is read, the same
        as a token issued via the `token` CLI command.
      tags: [tokens]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
            example:
              description: web UI test token
              ttl_seconds: 7776000
      responses:
        "201":
          description: The token was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenWithValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "401":
          $ref: "#/components/responses/Unauthorized"

    get:
      operationId: listTokens
      summary: List write bearer tokens
      description: |
        Returns every issued token's metadata - never a raw value, which
        by design no longer exists anywhere to return once a token is
        created. Includes tokens issued via the `token` CLI command
        alongside ones created here; a CLI-issued token has no owner.
      tags: [tokens]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Every issued token's metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TokenMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke a write bearer token
      description: |
        Invalidates the token issued under id. Revoking an id that's
        already expired or doesn't exist isn't an error - both leave
        every other token's state unaffected either way.
      tags: [tokens]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/tokenId"
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "204":
          description: The token was revoked, or already wasn't valid.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tokens/{id}/rotate:
    post:
      operationId: rotateToken
      summary: Rotate a write bearer token
      description: |
        Replaces the secret and expiry of the token issued under id,
        keeping its id, description, and owner unchanged - so an audit
        log entry, or anything else that already refers to the token by
        id, keeps resolving through the rotation. The old secret stops
        authenticating immediately. The new raw token value is returned
        here only, the same as `createToken`.

        Unlike `revokeToken`, an id that's unknown, already revoked, or
        already expired is an error: a rotate response promises the
        caller a working new secret, and there's no valid token to hand
        one to.
      tags: [tokens]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/tokenId"
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateTokenRequest"
            example:
              ttl_seconds: 7776000
      responses:
        "200":
          description: The token was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenWithValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tokens/{id}/purge:
    delete:
      operationId: purgeToken
      summary: Permanently delete a dead write bearer token
      description: |
        Permanently removes the token issued under id, once it's already
        revoked or past its expiry - `revokeToken`'s soft-delete stays the
        only way to invalidate a still-active token. Unlike `revokeToken`,
        an audit-log entry attributed to a purged token's id no longer
        resolves to a description or owner afterward - the accepted
        tradeoff for actually removing it.
      tags: [tokens]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/tokenId"
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "204":
          description: The token was purged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TokenStillActive"

  /consumer-tokens:
    post:
      operationId: createConsumerToken
      summary: Create a consumer read token
      description: |
        Issues a new read token scoped to one consumer name. The raw
        token value is returned here only - it is never recoverable
        again once this response is read. A write bearer token may mint
        one too, not only an admin session - a narrowing delegation,
        since the resulting token can only ever read as far as its one
        bound consumer, never as far as the write token that issued it
        (alrayyes/hush-hush#467). A session-authenticated call needs its
        CSRF token too; a bearer-token-authenticated one doesn't, since
        there's no session to have one.
      tags: [tokens]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/csrfTokenOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsumerTokenRequest"
            example:
              consumer: homelab/vps-docker
              description: deploy read token
              ttl_seconds: 7776000
      responses:
        "201":
          description: The consumer token was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerTokenWithValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "401":
          $ref: "#/components/responses/Unauthorized"

    get:
      operationId: listConsumerTokens
      summary: List consumer read tokens
      description: |
        Returns every issued consumer token's metadata - never a raw
        value, which by design no longer exists anywhere to return once a
        token is created.
      tags: [tokens]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Every issued consumer token's metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConsumerTokenMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /consumer-tokens/{id}:
    delete:
      operationId: revokeConsumerToken
      summary: Revoke a consumer read token
      description: |
        Invalidates the consumer token issued under id. Revoking an id
        that's already expired or doesn't exist isn't an error - both
        leave every other token's state unaffected either way. A write
        bearer token may revoke one too, the same as it may create one
        (alrayyes/hush-hush#467).
      tags: [tokens]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/consumerTokenId"
        - $ref: "#/components/parameters/csrfTokenOptional"
      responses:
        "204":
          description: The consumer token was revoked, or already wasn't valid.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /consumer-tokens/{id}/rotate:
    post:
      operationId: rotateConsumerToken
      summary: Rotate a consumer read token
      description: |
        Replaces the secret and expiry of the consumer token issued under
        id, keeping its id, consumer, and description unchanged. The old
        secret stops authenticating immediately. The new raw token value
        is returned here only, the same as `createConsumerToken`.

        Unlike `revokeConsumerToken`, an id that's unknown, already
        revoked, or already expired is an error: a rotate response
        promises the caller a working new secret, and there's no valid
        token to hand one to. A write bearer token may rotate one too,
        the same as it may create one (alrayyes/hush-hush#467).
      tags: [tokens]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/consumerTokenId"
        - $ref: "#/components/parameters/csrfTokenOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateConsumerTokenRequest"
            example:
              ttl_seconds: 7776000
      responses:
        "200":
          description: The consumer token was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerTokenWithValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /consumer-tokens/{id}/purge:
    delete:
      operationId: purgeConsumerToken
      summary: Permanently delete a dead consumer read token
      description: |
        Permanently removes the consumer token issued under id, once it's
        already revoked or past its expiry - `revokeConsumerToken`'s
        soft-delete stays the only way to invalidate a still-active token.
        Unlike `revokeConsumerToken`, an audit-log entry attributed to a
        purged token's id no longer resolves to a description or owner
        afterward - the accepted tradeoff for actually removing it. A
        write bearer token may purge one too, the same as it may create
        one (alrayyes/hush-hush#467).
      tags: [tokens]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/consumerTokenId"
        - $ref: "#/components/parameters/csrfTokenOptional"
      responses:
        "204":
          description: The consumer token was purged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TokenStillActive"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A write token, checked on every create, update, and delete call.
        Each token carries its own description and expiry, issued and
        revoked through the server's own `token` CLI command (direct
        store access, not an HTTP endpoint - issuing a *write* token over
        HTTP would need its own write token to call it with). Any number
        of tokens may be valid at once; revoking or expiring one never
        affects the others.

        Also accepted, as an alternative to `cookieAuth`, on every
        `/consumer-tokens` operation: a write token already reads or
        writes any object, so authorizing it to mint or manage a
        consumer token - itself scoped to reading a single consumer's
        objects - is a narrowing delegation, not the bootstrap problem
        minting a *write* token over HTTP would be
        (alrayyes/hush-hush#467).

    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        A browser session, issued by a successful `/auth/login/finish` or
        `/auth/register/finish` call. Used by the `/auth/*` (post-login),
        `/credentials/*`, and `/tokens/*` endpoints, and as an alternative
        to `bearerAuth` on `/objects/*` - an admin session reads or
        writes any object, the same access a write bearer token has.

    consumerBearerAuth:
      type: http
      scheme: bearer
      description: |
        A consumer read token, scoped to exactly one consumer name at
        creation. Authorizes `getObject` only for an object whose
        `used_by` list includes that token's bound consumer - unlike
        `bearerAuth`, which reads any object. Issued and managed through
        `/consumer-tokens`, never authorizes any endpoint besides
        `getObject`.

  parameters:
    slug:
      name: slug
      in: path
      required: true
      description: |
        The object's slug - the caller-facing identifier a writer chose at
        create time, the last path segment, and so has to survive being in
        a URL. The object's internal id is never part of any path
        (specs/secret-objects/spec.md's "Internal id decoupled from
        user-facing slug" requirement).
      schema:
        $ref: "#/components/schemas/ObjectSlug"

    caller:
      name: X-Caller
      in: header
      required: false
      description: |
        The caller's own identity - a repo or host name, whatever the
        caller wants attributed to it in the audit log. Not authenticated
        or verified: a courtesy label a caller presents about itself, not
        an identity check the service performs. Absent means the
        resulting audit log entry's caller field is empty.
      schema:
        type: string

    credentialId:
      name: id
      in: path
      required: true
      description: The credential's id.
      schema:
        $ref: "#/components/schemas/CredentialId"

    consumerName:
      name: name
      in: path
      required: true
      description: |
        The consumer's recorded name, taken verbatim from the rest of the
        path - unlike `id`, this isn't restricted to a URL-safe pattern,
        since a consumer name is free text that routinely contains `/`
        (`homelab/vps-docker`). Send it unencoded; the server matches
        everything after `/consumers/` as this value rather than treating
        `/` as a path separator, so there's no `%2F`-escaping for a client
        to get right or wrong.
      schema:
        type: string

    tokenId:
      name: id
      in: path
      required: true
      description: The token's id.
      schema:
        $ref: "#/components/schemas/TokenId"

    consumerTokenId:
      name: id
      in: path
      required: true
      description: The consumer token's id.
      schema:
        $ref: "#/components/schemas/ConsumerTokenId"

    csrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        The current session's own CSRF token - required on every
        session-authenticated request that changes state. Delivered as a
        second, readable `csrf_token` cookie alongside the (httpOnly)
        session cookie at login/registration time; the frontend reads that
        cookie and echoes its value back here.
      schema:
        type: string

    csrfTokenOptional:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        The current session's own CSRF token - required when the request
        is authenticated by a session, not present or checked when it's
        authenticated by a bearer token instead (which has no session, and
        so no CSRF token to send). See `csrfToken` for the always-required
        form used where session auth is the only option.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request could not be parsed as documented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: from must be RFC 3339

    UnprocessableEntity:
      description: |
        The request parsed, but a value in it is outside what the API
        allows. The message names the limit or the problem.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: ttl_seconds must be at most 31536000 (365 days)

    Unauthorized:
      description: The request is missing a valid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: missing or invalid bearer token

    NotFound:
      description: No object is stored under that slug.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unknown object

    UnknownConsumer:
      description: No stored object's used_by list currently records this consumer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unknown consumer

    ConsumerAlreadyExists:
      description: |
        This name already appears in the directory, whether added
        directly or recorded by an object's used_by list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: consumer already exists

    TokenStillActive:
      description: |
        This token is neither revoked nor expired - purge is only allowed
        once a token is already dead; revoke it first, or wait for it to
        expire.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: token must be revoked or expired before it can be purged

  schemas:
    ObjectSlug:
      type: string
      pattern: "^[a-z0-9][a-z0-9_-]*$"
      examples: [mattermost_deploy_webhook]
      description: |
        A caller-chosen, unique identifier for an object - what every
        documented request path (URL, CLI, API) addresses it by. The
        object's internal id is a separate, opaque value never exposed to
        or accepted from a caller (specs/secret-objects/spec.md's
        "Internal id decoupled from user-facing slug" requirement).

    CreateObjectRequest:
      type: object
      required: [slug, value]
      properties:
        slug:
          $ref: "#/components/schemas/ObjectSlug"
        value:
          type: string
          format: byte
          description: |
            The sealed (encrypted) value, base64-encoded. It has to be a
            well-formed age file naming at least one recipient; the
            service reads only its header, never the payload.
        used_by:
          $ref: "#/components/schemas/UsedByList"
        tags:
          $ref: "#/components/schemas/Tags"
        description:
          $ref: "#/components/schemas/ObjectDescription"
        keep_readable_copy:
          $ref: "#/components/schemas/KeepReadableCopy"

    UpdateObjectRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          format: byte
          description: |
            The new sealed (encrypted) value, base64-encoded. It has to be
            a well-formed age file naming at least one recipient; the
            service reads only its header, never the payload.
        used_by:
          allOf:
            - $ref: "#/components/schemas/UsedByList"
          description: |
            Replaces the object's recorded used_by list, the same way
            CreateObjectRequest's used_by sets it initially - omit this
            field entirely to leave the existing list untouched. An
            empty array clears it.
        tags:
          allOf:
            - $ref: "#/components/schemas/Tags"
          description: |
            Replaces the object's tags - omit this field entirely to leave
            them untouched. An empty array clears them.
        keep_readable_copy:
          $ref: "#/components/schemas/KeepReadableCopy"

    KeepReadableCopy:
      type: boolean
      default: false
      description: |
        Requests that the owner's own escrowed identity public key be
        included as an additional decrypt recipient, alongside whatever
        consumer recipients the client already resolved
        (specs/secret-objects/spec.md's "Opt-in owner-recipient inclusion
        at create time" requirement). Omitting this field (the default)
        means the owner is not added as a recipient - this service never
        makes ownership imply decrypt access on its own.

        This is a client-side sealing instruction, not something this
        service enforces or verifies: it never decrypts, and never adds a
        recipient to `value` itself - the caller has to add the owner's
        public key (`GET /auth/identity`) to its own recipient list before
        sealing. A create or update response echoes back exactly what that
        same request asked for; it isn't persisted, so a later fetch never
        carries this field.

    ObjectMetadata:
      type: object
      required: [slug, tags]
      properties:
        slug:
          $ref: "#/components/schemas/ObjectSlug"
        used_by:
          $ref: "#/components/schemas/UsedByList"
        tags:
          $ref: "#/components/schemas/Tags"
        description:
          $ref: "#/components/schemas/ObjectDescription"
        keep_readable_copy:
          $ref: "#/components/schemas/KeepReadableCopy"
        created_at:
          type: string
          format: date-time
          description: |
            When the object was created. Returned by `GET /objects`; left
            out of a create or update response.
        updated_at:
          type: string
          format: date-time
          description: |
            When the object's value was last replaced - equal to
            `created_at` for an object never updated. Returned by
            `GET /objects`; left out of a create or update response.
        created_by:
          allOf:
            - $ref: "#/components/schemas/Actor"
          description: |
            Who created the object, from the audit log's create entry. Left
            out when the audit log has none, as for an object that predates
            auditing.
        updated_by:
          allOf:
            - $ref: "#/components/schemas/Actor"
          description: |
            Who last updated the object, from the audit log. The creator
            for an object never updated. Left out when the audit log has
            no entry at all.

    Actor:
      type: object
      required: [type, id]
      description: |
        Who performed an audited write. `type` is `session` (the admin
        account, `id` is its actor id), `token` (a write token, `id` is its
        token id) or `consumer_token` (a consumer token, `id` is its id) -
        the same values `GET /audit-log` reports.
      properties:
        type:
          type: string
          examples: [session]
        id:
          type: string
          examples: [a1b2c3d4e5f6a7b8]

    Tag:
      type: string
      pattern: "^[a-z0-9._/-]{1,32}$"
      examples: [prod]

    Tags:
      type: array
      maxItems: 10
      description: |
        Labels for grouping and filtering objects (`GET /objects?tag=`).
        Free-form, 1 to 32 characters from `a-z 0-9 . _ / -`, at most 10
        per object. Uppercase is converted to lowercase and duplicates are dropped.
        Metadata only - never part of the sealed value. A response always
        carries the array, empty when the object has none.
      items:
        $ref: "#/components/schemas/Tag"
      examples:
        - [prod, homelab]

    ObjectDescription:
      type: string
      description: |
        A free-text label set at creation, for a reader who only knows the
        slug. Fixed at creation - there is no way to change it later.
      examples: ["prod deploy webhook for homelab/vps-docker"]

    UsedByList:
      type: array
      description: |
        The consumers (repos or hosts) recorded as depending on this
        object. Set at creation, and replaceable later via
        UpdateObjectRequest's own used_by field - a plain value update
        that omits it leaves the list as it was.
      items:
        type: string
      examples:
        - [homelab/vps-docker]

    UsedBy:
      type: object
      required: [used_by]
      properties:
        used_by:
          $ref: "#/components/schemas/UsedByList"

    ConsumerEntry:
      type: object
      required: [name, secret_count]
      properties:
        name:
          type: string
          description: A distinct consumer name recorded in some object's used_by list.
        secret_count:
          type: integer
          format: int32
          description: How many stored secret objects' used_by list includes this consumer.
        public_key:
          type: string
          description: |
            The consumer's registered age public key, safe to store and
            return server-side since it's public - a private key is never
            sent to or stored by this API. Absent entirely when no key has
            been registered for this consumer, rather than present as an
            error or `null`.
      example:
        name: homelab/vps-docker
        secret_count: 1

    ConsumersPage:
      type: object
      required: [consumers, total]
      properties:
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerEntry"
        total:
          type: integer
          format: int32
          description: |
            The total number of consumers matching the request's filter,
            across every page - not just this page's own count - so a
            caller can render page-number navigation.

    AddConsumerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The consumer's name. Rejected if it already appears in the directory.
          examples: [homelab/new-device]

    UpdateConsumerRequest:
      type: object
      minProperties: 1
      description: |
        At least one of `name` or `public_key` is required (enforced by
        `minProperties` above); a field left out leaves that aspect of the
        consumer unchanged. There is no way to clear a registered public
        key through this request, only to set or replace one.
      properties:
        name:
          type: string
          description: |
            The consumer's new name. If it already matches another
            recorded consumer, the two merge - every object recording
            either ends up recording just the new name, no duplicates. A
            registered public key survives the merge: the target name's
            own key wins if it already had one, otherwise the renamed
            consumer's key carries over.
          examples: [homelab/vps-docker-2]
        public_key:
          type: string
          description: |
            Registers or replaces the consumer's age public key, safe to
            store server-side since it's public. A consumer's private key
            SHALL NOT be sent here or anywhere else in this API - this
            field only ever accepts a public key. Registering a key
            doesn't require the consumer to already be recorded anywhere;
            a name never referenced by any object's `used_by` list yet is
            accepted the same as an existing one.
          examples: [age1exampleplaceholderpublickey]

    AuditLogEntry:
      type: object
      required: [id, object_id, action, timestamp, ip]
      properties:
        id:
          type: integer
          format: int64
          description: |
            This entry's own id - stable and strictly increasing, so it
            doubles as the cursor for the `after` query parameter.
        object_id:
          $ref: "#/components/schemas/ObjectSlug"
        action:
          type: string
          enum: [create, read, update, delete]
        timestamp:
          type: string
          format: date-time
        caller:
          type: string
          description: The caller's presented identity, if any.
        ip:
          type: string
          description: |
            The request's source IP. Unlike caller, this is never
            self-reported - it's the one piece of the request nobody gets
            to lie about via a header. Currently the immediate TCP peer's
            address; this service isn't deployed behind a reverse proxy or
            load balancer, so X-Forwarded-For (or similar) support isn't
            implemented yet.
        actor_type:
          type: string
          enum: [token, session]
          description: |
            The kind of verified credential that authenticated this call -
            absent for an unauthenticated read. Unlike caller, this is
            never self-reported.
        actor_id:
          type: string
          description: |
            The specific token id or admin account this call was
            authenticated as - absent for an unauthenticated read.

    AuditActorOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
          description: What to send back as the `actor` query parameter to select this actor.
        label:
          type: string
          description: What to show the user - "admin", "token:<id>", or "none".
      example:
        value: a1b2c3d4e5f6a7b8
        label: "token:a1b2c3d4e5f6a7b8"

    AuditLogFilterOptions:
      type: object
      required: [object_ids, actors, callers]
      properties:
        object_ids:
          type: array
          items:
            $ref: "#/components/schemas/ObjectSlug"
          description: Every distinct object id currently recorded in the audit log.
        actors:
          type: array
          items:
            $ref: "#/components/schemas/AuditActorOption"
          description: Every distinct actor currently recorded in the audit log.
        callers:
          type: array
          items:
            type: string
          description: Every distinct caller currently recorded in the audit log.

    Ready:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: |
            The running server's own version, as goreleaser stamped it -
            "dev" for a plain `go build`. The web UI's footer links this
            to the changelog page rather than hardcoding a version that
            would drift from what's actually running.
          examples: ["2.6.0", "dev"]
        environment:
          type: string
          maxLength: 40
          description: |
            The operator's own short label for this instance, from the
            `INSTANCE_LABEL` setting - for example `prod / homelab`. The
            web UI's top bar shows it so an operator can tell instances
            apart. Omitted when no label is set. This endpoint is
            unauthenticated, so the label is public: never put anything
            sensitive in it.
          examples: ["prod / homelab"]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            What went wrong, in terms safe to show a caller. Nothing here
            handles authentication with a detail worth holding back.
          examples: [unknown object]

    AuthStatus:
      type: object
      required: [bootstrapped]
      properties:
        bootstrapped:
          type: boolean
          description: Whether an admin account has been created yet.

    OwnerIdentity:
      type: object
      properties:
        public_key:
          type: string
          description: |
            The session's user's escrowed writer identity public key (an
            age recipient string), absent if that user hasn't completed a
            first registration yet.
          examples:
            - age1qyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqssgxdaz2

    RegistrationOptions:
      type: object
      description: |
        A WebAuthn `PublicKeyCredentialCreationOptions` object, passed
        straight to the browser's `navigator.credentials.create()` -
        opaque to this service's own clients, defined by the WebAuthn
        specification rather than reproduced here field by field.
      additionalProperties: true

    RegistrationFinishRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          description: |
            The browser's attestation response, exactly as
            `navigator.credentials.create()` returned it.
          additionalProperties: true
        nickname:
          type: string
          description: A human-readable label for this credential, shown in the credentials list.
          examples: [YubiKey 5C]
        wrapped_identity:
          type: string
          description: |
            This credential's own copy of the user's escrowed writer
            identity private key, wrapped client-side with a key derived
            from this credential's WebAuthn PRF extension output and
            base64-encoded. Omitted when the browser's registration
            reported no PRF support for this credential - the server
            never generates, verifies, or unwraps this value, only stores
            it.
        public_key:
          type: string
          description: |
            The escrowed writer identity's age recipient string, sent
            only on the account's first-ever registration - a repeat
            registration resending this is a no-op against the identity
            already recorded, never an overwrite.
          examples:
            [age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq]
        recovery_wrapped_identity:
          type: string
          description: |
            The escrowed writer identity's private key, wrapped
            client-side with a key derived from the one-time break-glass
            recovery phrase, sent only on the account's first-ever
            registration. The server never sees the phrase itself, only
            this already-wrapped copy.

    LoginOptions:
      type: object
      description: |
        A WebAuthn `PublicKeyCredentialRequestOptions` object, passed
        straight to the browser's `navigator.credentials.get()`.
      additionalProperties: true

    LoginFinishRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          description: |
            The browser's assertion response, exactly as
            `navigator.credentials.get()` returned it.
          additionalProperties: true

    CredentialId:
      type: string
      examples: [Zm9vYmFyYmF6]

    Credential:
      type: object
      required: [id, nickname, created_at]
      properties:
        id:
          $ref: "#/components/schemas/CredentialId"
        nickname:
          type: string
          examples: [YubiKey 5C]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: Absent if this credential has never been used to log in.
        wrapped_identity:
          type: string
          description: |
            This credential's own copy of the user's escrowed writer
            identity private key, wrapped with a key derived from this
            credential's WebAuthn PRF extension output and
            base64-encoded. Absent for a credential that doesn't support
            PRF. Safe to return to the authenticated owner: it's already
            wrapped, and only unwrappable with that same credential's own
            PRF secret or the break-glass recovery phrase.

    CredentialRenameRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          examples: [YubiKey 5C - office]

    TokenId:
      type: string
      pattern: "^[0-9a-f]{16}$"
      examples: [a1b2c3d4e5f6a7b8]

    TokenTtlSeconds:
      type: integer
      format: int64
      minimum: 1
      maximum: 31536000
      default: 7776000
      description: |
        How long a token stays valid for, starting now. The default is 90
        days (7776000), and the cap is 365 days (31536000): a longer
        lifetime is a 422 that names the limit. A zero or negative value is
        a 400. The cap applies when a token is minted or rotated; a token
        issued before it existed keeps working until it expires.

        The field stays `required` so generated clients keep a plain
        integer rather than an optional one, which would change their types
        for a limit they don't need. A request that leaves it out anyway is
        given the default rather than rejected.
      examples: [7776000]

    CreateTokenRequest:
      type: object
      required: [description, ttl_seconds]
      properties:
        description:
          type: string
          examples: [web UI test token]
        ttl_seconds:
          $ref: "#/components/schemas/TokenTtlSeconds"

    TokenMetadata:
      type: object
      required: [id, description, created_at, expires_at, revoked]
      properties:
        id:
          $ref: "#/components/schemas/TokenId"
        description:
          type: string
        owner:
          type: string
          description: |
            The admin account that created this token over HTTP. Absent
            for a token issued via the `token` CLI command, which has no
            session to attribute to - never a guessed value.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        last_used_at:
          type: string
          format: date-time
          description: Absent if this token has never authenticated a request.
        status:
          $ref: "#/components/schemas/TokenStatus"
        allowed_actions:
          $ref: "#/components/schemas/TokenAllowedActions"

    TokenStatus:
      type: string
      enum: [active, expired, revoked]
      description: |
        What the token is right now, by the server's own clock: `revoked`
        if it was revoked (even if it has also expired), `expired` if its
        `expires_at` has passed, `active` otherwise. Always sent by this
        server; optional in the schema so a client generated from it still
        reads a response from an older one.

    TokenAllowedActions:
      type: array
      description: |
        What may be done to the token in its current state: `rotate` and
        `revoke` while it is `active`, only `purge` once it is `expired` or
        `revoked`. The endpoints enforce the same rule themselves - a purge
        of an active token is still a 409 - so a client that acts on a stale
        view gets the server's answer. Hiding a button is cosmetic; this is
        what to show.
      items:
        type: string
        enum: [rotate, revoke, purge]

    RotateTokenRequest:
      type: object
      required: [ttl_seconds]
      properties:
        ttl_seconds:
          $ref: "#/components/schemas/TokenTtlSeconds"

    TokenWithValue:
      allOf:
        - $ref: "#/components/schemas/TokenMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: string
              description: |
                The raw bearer token. Shown here once, at creation, and
                never again - the same as a token issued via the `token`
                CLI command.

    ConsumerTokenId:
      type: string
      pattern: "^[0-9a-f]{16}$"
      examples: [b2c3d4e5f6a7b8c9]

    CreateConsumerTokenRequest:
      type: object
      required: [consumer, description, ttl_seconds]
      properties:
        consumer:
          type: string
          description: |
            The consumer this token is scoped to - it authorizes
            `getObject` only for an object whose `used_by` list includes
            this name. Free text, matching how a consumer name is stored
            elsewhere (`used_by`, `/consumers`); the consumer doesn't have
            to already exist.
          examples: [homelab/vps-docker]
        description:
          type: string
          examples: [deploy read token]
        ttl_seconds:
          $ref: "#/components/schemas/TokenTtlSeconds"

    ConsumerTokenMetadata:
      type: object
      required: [id, consumer, description, created_at, expires_at, revoked]
      properties:
        id:
          $ref: "#/components/schemas/ConsumerTokenId"
        consumer:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        last_used_at:
          type: string
          format: date-time
          description: Absent if this token has never authenticated a request.
        status:
          $ref: "#/components/schemas/TokenStatus"
        allowed_actions:
          $ref: "#/components/schemas/TokenAllowedActions"

    RotateConsumerTokenRequest:
      type: object
      required: [ttl_seconds]
      properties:
        ttl_seconds:
          $ref: "#/components/schemas/TokenTtlSeconds"

    ConsumerTokenWithValue:
      allOf:
        - $ref: "#/components/schemas/ConsumerTokenMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: string
              description: |
                The raw consumer token. Shown here once, at creation, and
                never again.
